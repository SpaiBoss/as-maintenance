services:
  - type: web
    name: as-maintenance
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # old builder-site URLs -> new pages (301)
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /about-us
        destination: /about/
      - type: redirect
        source: /our-work
        destination: /
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
